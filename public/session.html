<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a session</title>
<!-- Private/link-only by default (§3): a One-Off Session must never turn up in
     search or public discovery. The link is the distribution mechanism. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141B2B'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='28' fill='%23D9632D'%3Eh%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#D9632D;
  --navy:#141B2B;
  --ink:#1a1f2e;
  --ink-2:#4a5163;
  --ink-3:#7a8294;
  --line:#e6e8ec;
  --surface:#fff;
  --bg:#f4f5f7;
  --font:'DM Sans',system-ui,sans-serif;
  --display:'Plus Jakarta Sans',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 72px;}

/* Visual hierarchy per §22: identity → session → what/where/when → times → price → details → pay */
.biz{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.biz img{height:34px;width:auto;max-width:150px;object-fit:contain;border-radius:8px;}
.biz .biz-name{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--brand);}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px;}
.hero h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15;color:var(--navy);}
.hero .blurb{font-size:15px;color:var(--ink-2);margin-top:8px;line-height:1.55;}
.facts{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.fact{display:flex;gap:9px;align-items:flex-start;font-size:15px;color:var(--ink);}
.fact .ico{width:20px;flex:none;text-align:center;}
.price-row{display:flex;align-items:baseline;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap;}
.price{font-family:var(--display);font-weight:800;font-size:26px;color:var(--navy);}
.pay-line{font-size:14px;color:var(--ink-2);}
.policy{font-size:13px;color:var(--ink-3);margin-top:10px;line-height:1.5;}

.btn{display:block;width:100%;padding:15px;border:0;border-radius:999px;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-align:center;}
.btn:disabled{opacity:.45;cursor:default;}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);font-weight:600;font-size:14px;padding:11px;}
.btn-row{display:flex;gap:10px;margin-top:16px;}
.btn-row .btn{flex:1;}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;}
section.card h2{font-family:var(--display);font-weight:700;font-size:17px;color:var(--navy);margin-bottom:14px;}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;}
.slot{padding:12px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;text-align:center;}
.slot:hover:not(:disabled){border-color:var(--brand);}
.slot.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.slot:disabled{background:#f6f7f9;color:#b6bcc6;cursor:not-allowed;text-decoration:line-through;}
.remaining{font-size:13px;color:var(--ink-3);margin-top:12px;}

label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
.field{margin-bottom:14px;}
input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink);}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(217,99,45,.25);border-color:var(--brand);}
textarea{min-height:78px;resize:vertical;}
.req{color:var(--brand);}

.review{background:#fbfbfc;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
.review .r-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0;}
.review .r-row .k{color:var(--ink-3);}
.review .r-row .v{font-weight:600;text-align:right;}
.review .r-total{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;}

.trust{display:flex;flex-direction:column;gap:7px;margin-top:16px;}
.trust div{font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start;}

.err{background:#fdecea;color:#a8271b;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px;}
.notice{background:#eef1f5;color:var(--ink-2);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px;}

.done{background:var(--navy);color:#fff;border-radius:var(--radius);padding:28px 24px;margin-bottom:18px;}
.done h1{font-family:var(--display);font-weight:800;font-size:28px;margin-bottom:6px;}
.done .d-sub{opacity:.85;font-size:15px;}
.done .d-block{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18);font-size:15px;line-height:1.7;}
.done .d-code{font-size:13px;opacity:.7;margin-top:12px;letter-spacing:.05em;}

.state-msg{padding:70px 20px;text-align:center;color:var(--ink-2);font-size:15px;line-height:1.6;}
.state-msg strong{display:block;font-family:var(--display);font-size:19px;color:var(--navy);margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="state-msg"><strong>Loading…</strong></div>
</div>
<script>
(function(){
  'use strict';

  // Same public credentials portal.html uses — the anon key only ever reaches the
  // one-off-sessions Edge Function, which resolves the opaque token server-side.
  // No table is ever queried directly from this page.
  var SUPA_URL = 'https://rtwxxkxpkqdrhclkozma.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0d3h4a3hwa3FkcmhjbGtvem1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MjA4MjgsImV4cCI6MjA5Nzk5NjgyOH0.ky9ycGJ621E4ab078pCIR4-1X_XS6OUpfPmH3v8tzf8';

  var root = document.getElementById('root');
  // What the customer has typed lives here, NOT only in the DOM. The page
  // re-renders on every slot change and every validation message, and losing a
  // half-filled form to a missing field would be the fastest way to lose a
  // booking on a link someone tapped from Instagram.
  var ctx = {
    token:null, data:null, slot:null, booking:null, confirmation:null, error:null, busy:false,
    form:{ name:'', email:'', phone:'', answers:{} }
  };

  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function money(cents){ var n=Math.round(Number(cents)||0)/100; return '$'+n.toFixed(2).replace(/\.00$/,''); }

  function friendlyDate(ds){
    if(!ds)return'';
    try{
      var p=String(ds).slice(0,10).split('-').map(Number);
      return new Date(p[0],(p[1]||1)-1,p[2]||1).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    }catch(e){return String(ds);}
  }
  function friendlyTime(hm){
    if(!hm)return'';
    var p=String(hm).slice(0,5).split(':'); var hh=Number(p[0]), mm=Number(p[1]);
    if(!isFinite(hh)||!isFinite(mm))return String(hm);
    return ((hh%12)||12)+':'+String(mm).padStart(2,'0')+' '+(hh>=12?'PM':'AM');
  }

  /** The token lives in the path (/session/<token>) so the link is clean and shareable;
   *  ?t= is accepted too for anything that can only carry a query string. */
  function readToken(){
    var m=(location.pathname||'').match(/\/session\/([^/?#]+)/);
    if(m&&m[1])return decodeURIComponent(m[1]);
    try{ return new URLSearchParams(location.search).get('t')||null; }catch(e){ return null; }
  }

  async function api(action, payload){
    var res = await fetch(SUPA_URL+'/functions/v1/one-off-sessions',{
      method:'POST',
      headers:{'content-type':'application/json',apikey:SUPA_KEY,authorization:'Bearer '+SUPA_KEY},
      body:JSON.stringify(Object.assign({action:action},payload||{}))
    });
    var data=null; try{ data=await res.json(); }catch(e){}
    return data || { ok:false, error:'network_error' };
  }

  /* ───────────────────────── views ───────────────────────── */

  function renderMissing(msg){
    root.innerHTML='<div class="state-msg"><strong>'+esc(msg.title)+'</strong>'+esc(msg.body)+'</div>';
  }

  function bizHtml(b){
    var logo = b.logo_url ? '<img src="'+esc(b.logo_url)+'" alt="'+esc(b.name)+'">' : '';
    return '<div class="biz">'+logo+'<span class="biz-name">'+esc(b.name||'')+'</span></div>';
  }

  function heroHtml(d){
    var s=d.session, p=d.payment;
    var facts='';
    facts+='<div class="fact"><span class="ico">📅</span><span>'+esc(friendlyDate(s.date))+'</span></div>';
    facts+='<div class="fact"><span class="ico">⏰</span><span>'+esc(friendlyTime(s.start_time))+' – '+esc(friendlyTime(s.end_time))+
      ' &middot; '+esc(s.duration_minutes)+'-minute '+(s.duration_minutes?'appointments':'')+'</span></div>';
    if(s.location) facts+='<div class="fact"><span class="ico">📍</span><span>'+esc(s.location)+'</span></div>';

    var priceRow='';
    if(p.price_cents>0){
      priceRow='<div class="price-row"><span class="price">'+esc(money(p.price_cents))+'</span>'+
        '<span class="pay-line">'+esc(p.line)+'</span></div>';
    }
    var policy = d.policy ? '<div class="policy">'+esc(d.policy)+'</div>' : '';

    return '<div class="hero">'+
      '<h1>'+esc(s.name)+'</h1>'+
      (s.description?'<div class="blurb">'+esc(s.description)+'</div>':'')+
      '<div class="facts">'+facts+'</div>'+
      priceRow+policy+
      '</div>';
  }

  /** Honest closed/sold-out states — never a Choose a Time button for a session
   *  that cannot actually be booked. */
  function closedHtml(d){
    return '<section class="card"><h2>'+esc(d.session.cta)+'</h2>'+
      '<div class="notice">'+esc(d.session.block_reason||'This session is no longer accepting bookings.')+'</div>'+
      (d.business.phone?'<div class="policy">Questions? Call '+esc(d.business.phone)+'.</div>':'')+
      '</section>';
  }

  function slotsHtml(d){
    var slots=d.availability.slots||[];
    if(!slots.length) return '<section class="card"><h2>Available Times</h2><div class="notice">No times are open right now.</div></section>';
    var buttons=slots.map(function(s,i){
      var on = ctx.slot===s.time ? ' on' : '';
      return '<button type="button" class="slot'+on+'" data-slot="'+esc(s.time)+'"'+(s.available?'':' disabled')+'>'+esc(s.label)+'</button>';
    }).join('');
    var remaining = d.availability.remaining;
    return '<section class="card"><h2>Available Times</h2>'+
      '<div class="slots">'+buttons+'</div>'+
      '<div class="remaining">'+esc(remaining)+' of '+esc(d.availability.total)+' spot'+(d.availability.total===1?'':'s')+' left.</div>'+
      '</section>';
  }

  function questionsHtml(qs){
    return (qs||[]).map(function(q,i){
      var id='q_'+i;
      var label='<label for="'+id+'">'+esc(q.label||q.id||('Question '+(i+1)))+(q.required?' <span class="req">*</span>':'')+'</label>';
      var key=q.id||q.label||id;
      var val=ctx.form.answers[key]||'';
      var field;
      if(q.type==='textarea') field='<textarea id="'+id+'" data-q="'+esc(key)+'"'+(q.required?' required':'')+'>'+esc(val)+'</textarea>';
      else if(q.type==='select'&&Array.isArray(q.options)) {
        field='<select id="'+id+'" data-q="'+esc(key)+'"'+(q.required?' required':'')+'><option value="">Choose…</option>'+
          q.options.map(function(o){return '<option'+(String(o)===String(val)?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
      }
      else field='<input type="text" id="'+id+'" data-q="'+esc(key)+'" value="'+esc(val)+'"'+(q.required?' required':'')+'>';
      return '<div class="field">'+label+field+'</div>';
    }).join('');
  }

  function detailsHtml(d){
    if(!ctx.slot) return '';
    var p=d.payment;
    var payNote = p.charge_now_cents>0
      ? (p.stripe_ready
          ? '<div class="notice">You\'ll pay '+esc(money(p.charge_now_cents))+' securely by card on the next screen.</div>'
          : '<div class="notice">Card payment isn\'t set up for this business yet, so nothing is collected online — they\'ll arrange payment with you directly.</div>')
      : '';
    return '<section class="card"><h2>Your details</h2>'+
      (ctx.error?'<div class="err">'+esc(ctx.error)+'</div>':'')+
      '<div class="field"><label for="f-name">Name <span class="req">*</span></label><input type="text" id="f-name" autocomplete="name" value="'+esc(ctx.form.name)+'" required></div>'+
      '<div class="field"><label for="f-email">Email <span class="req">*</span></label><input type="email" id="f-email" autocomplete="email" value="'+esc(ctx.form.email)+'" required></div>'+
      '<div class="field"><label for="f-phone">Phone</label><input type="tel" id="f-phone" autocomplete="tel" value="'+esc(ctx.form.phone)+'"></div>'+
      questionsHtml(d.session.booking_questions)+
      '<div class="review">'+
        '<div class="r-row"><span class="k">'+esc(d.session.name)+'</span><span class="v">'+esc(friendlyDate(d.session.date))+'</span></div>'+
        '<div class="r-row"><span class="k">Time</span><span class="v">'+esc(friendlyTime(ctx.slot))+'</span></div>'+
        (d.session.location?'<div class="r-row"><span class="k">Where</span><span class="v">'+esc(d.session.location)+'</span></div>':'')+
        (p.price_cents>0?'<div class="r-row r-total"><span class="k">Due today</span><span class="v">'+esc(money(p.stripe_ready?p.charge_now_cents:0))+'</span></div>':'')+
        (p.price_cents>0&&p.balance_due_cents>0?'<div class="r-row"><span class="k">At your session</span><span class="v">'+esc(money(p.price_cents-(p.stripe_ready?p.charge_now_cents:0)))+'</span></div>':'')+
      '</div>'+
      payNote+
      '<button type="button" class="btn" id="confirm-btn"'+(ctx.busy?' disabled':'')+'>'+
        (ctx.busy?'Working…':(p.charge_now_cents>0&&p.stripe_ready?'Continue to payment':'Confirm booking'))+'</button>'+
      '<div class="trust">'+
        '<div><span>🔒</span><span>Payments are processed by Stripe. Hubly never stores your card details.</span></div>'+
        '<div><span>✉️</span><span>You\'ll get a confirmation email as soon as your booking is complete.</span></div>'+
        (d.business.phone?'<div><span>📞</span><span>Need to change something? Call '+esc(d.business.phone)+'.</span></div>':'')+
      '</div>'+
      '</section>';
  }

  function icsHref(d,c){
    // A real downloadable calendar entry built from the confirmed booking — no
    // third-party service, no data leaving the page.
    var date=String(c.date).replace(/-/g,'');
    var t=String(c.time_label||'00:00').slice(0,5).replace(':','');
    var start=date+'T'+t+'00';
    var mins=Number(d.session.duration_minutes)||30;
    var hh=Number(String(c.time_label).slice(0,2))||0, mm=Number(String(c.time_label).slice(3,5))||0;
    var endMin=hh*60+mm+mins;
    var end=date+'T'+String(Math.floor(endMin/60)%24).padStart(2,'0')+String(endMin%60).padStart(2,'0')+'00';
    var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hubly//One-Off Session//EN','BEGIN:VEVENT',
      'DTSTART:'+start,'DTEND:'+end,'SUMMARY:'+(c.session_name||'Session'),
      c.location?('LOCATION:'+c.location):'','END:VEVENT','END:VCALENDAR'].filter(Boolean);
    return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(lines.join('\r\n'));
  }

  function confirmedHtml(d,c){
    var paid = c.paid_today_cents>0 ? money(c.paid_today_cents)+' paid today' : null;
    var balance = c.balance_due_cents>0 ? money(c.balance_due_cents)+' remaining' : null;
    var contact=[];
    if(c.business.phone) contact.push(esc(c.business.phone));
    if(c.business.email) contact.push(esc(c.business.email));
    return '<div class="done">'+
      '<h1>You\'re booked!</h1>'+
      '<div class="d-sub">'+esc(c.session_name)+'</div>'+
      '<div class="d-block">'+esc(friendlyDate(c.date))+'<br>'+esc(friendlyTime(c.time_label))+
        (c.location?'<br>'+esc(c.location):'')+'</div>'+
      ((paid||balance)?'<div class="d-block">'+[paid,balance].filter(Boolean).map(esc).join('<br>')+'</div>':'')+
      (contact.length?'<div class="d-block">'+esc(c.business.name||'')+'<br>'+contact.join('<br>')+'</div>':'')+
      '<div class="d-code">Confirmation '+esc(c.confirmation_code)+'</div>'+
      '</div>'+
      '<a class="btn" href="'+esc(icsHref(d,c))+'" download="session.ics">Add to Calendar</a>'+
      (c.email_sent?'<div class="policy" style="text-align:center;margin-top:14px;">A confirmation email is on its way to you.</div>':'');
  }

  function render(){
    var d=ctx.data;
    if(!d){ return; }
    var html = bizHtml(d.business) + heroHtml(d);
    if(ctx.confirmation){
      root.innerHTML = bizHtml(d.business) + confirmedHtml(d,ctx.confirmation);
      window.scrollTo(0,0);
      return;
    }
    if(!d.session.bookable){
      root.innerHTML = html + closedHtml(d);
      return;
    }
    html += slotsHtml(d) + detailsHtml(d);
    root.innerHTML = html;
    wire();
  }

  function wire(){
    root.querySelectorAll('.slot[data-slot]').forEach(function(b){
      b.addEventListener('click',function(){
        ctx.slot=b.getAttribute('data-slot');
        ctx.error=null;
        render();
        var det=root.querySelector('#f-name');
        if(det) det.closest('section').scrollIntoView({behavior:'smooth',block:'start'});
      });
    });
    var confirm=root.querySelector('#confirm-btn');
    if(confirm) confirm.addEventListener('click',submit);

    // Mirror every field into ctx.form so a re-render restores it verbatim.
    var name=root.querySelector('#f-name'); if(name) name.addEventListener('input',function(){ctx.form.name=name.value;});
    var email=root.querySelector('#f-email'); if(email) email.addEventListener('input',function(){ctx.form.email=email.value;});
    var phone=root.querySelector('#f-phone'); if(phone) phone.addEventListener('input',function(){ctx.form.phone=phone.value;});
    root.querySelectorAll('[data-q]').forEach(function(elq){
      var handler=function(){ ctx.form.answers[elq.getAttribute('data-q')]=elq.value; };
      elq.addEventListener('input',handler);
      elq.addEventListener('change',handler);
    });
  }

  function syncFormFromDom(){
    var n=root.querySelector('#f-name'), e=root.querySelector('#f-email'), p=root.querySelector('#f-phone');
    if(n) ctx.form.name=n.value;
    if(e) ctx.form.email=e.value;
    if(p) ctx.form.phone=p.value;
    root.querySelectorAll('[data-q]').forEach(function(elq){
      ctx.form.answers[elq.getAttribute('data-q')] = elq.value || '';
    });
    return ctx.form;
  }

  async function submit(){
    if(ctx.busy) return;
    var d=ctx.data;
    var form=syncFormFromDom();
    var name=form.name||'', email=form.email||'', phone=form.phone||'';
    if(!name.trim()){ ctx.error='Please add your name.'; render(); return; }
    if(!email.trim()){ ctx.error='Please add an email so we can send your confirmation.'; render(); return; }
    var missing=null;
    (d.session.booking_questions||[]).forEach(function(q){
      if(!q.required) return;
      var key=q.id||q.label;
      if(!String(form.answers[key]||'').trim()) missing = missing || (q.label||'a required question');
    });
    if(missing){ ctx.error='Please answer: '+missing; render(); return; }

    ctx.busy=true; ctx.error=null; render();

    var res = await api('public_book',{
      token: ctx.token,
      slot_time: ctx.slot,
      name: name.trim(),
      email: email.trim(),
      phone: phone.trim(),
      answers: form.answers
    });

    if(!res.ok){
      ctx.busy=false;
      ctx.error = res.error || 'That didn\'t go through — please try again.';
      // A lost race / calendar conflict means the grid is stale; refresh it so the
      // customer picks from what's genuinely open rather than retrying a dead slot.
      if(res.code==='slot_taken'||res.code==='calendar_conflict'||res.code==='sold_out'){
        ctx.slot=null;
        await load(true);
      }
      render();
      return;
    }

    ctx.booking=res.booking_id;

    if(res.requires_payment){
      // Stripe Connect checkout, opened server-side from the token + booking id
      // so this page never has to know the business id. The booking stays
      // pending until the WEBHOOK confirms payment — the redirect below
      // confirms nothing on its own.
      var pay = await api('public_checkout',{
        token: ctx.token,
        booking_id: res.booking_id,
        return_url: location.origin + location.pathname
      });
      if(pay && pay.ok && pay.url){ location.href = pay.url; return; }
      ctx.busy=false;
      ctx.error = 'We couldn\'t open the payment page. Your time is held for now — please try again.';
      render();
      return;
    }

    ctx.busy=false;
    ctx.confirmation=res.confirmation;
    render();
  }

  /** Returning from Stripe: the page NEVER decides a booking is paid. It re-reads
   *  the session and polls briefly for the webhook to land, and says so honestly
   *  if it hasn't yet. */
  async function resumeFromStripe(bookingId){
    root.innerHTML='<div class="state-msg"><strong>Confirming your payment…</strong>This takes a few seconds.</div>';
    for(var i=0;i<10;i++){
      var res=await api('public_booking_status',{token:ctx.token,booking_id:bookingId});
      if(res && res.ok && res.status==='confirmed'){
        ctx.confirmation=res.confirmation;
        await load(true);
        render();
        return;
      }
      await new Promise(function(r){setTimeout(r,1500);});
    }
    await load(true);
    ctx.error='Your payment is still being confirmed. You\'ll get an email the moment it lands — no need to book again.';
    render();
  }

  async function load(quiet){
    var res = await api('public_get',{token:ctx.token});
    if(!res.ok){
      if(!quiet) renderMissing({title:'This session link isn\'t available',body:'It may have been closed by the business, or the link may be incomplete. Check the link you were sent, or contact the business directly.'});
      return false;
    }
    ctx.data = res;
    return true;
  }

  async function boot(){
    ctx.token = readToken();
    if(!ctx.token){
      renderMissing({title:'This session link isn\'t available',body:'Open the link the business sent you to book a time.'});
      return;
    }
    var ok = await load(false);
    if(!ok) return;

    var params = new URLSearchParams(location.search);
    var returned = params.get('stripe_pay');
    var bookingId = params.get('one_off_session_booking_id');
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
    if(returned==='success' && bookingId){ await resumeFromStripe(bookingId); return; }
    if(returned==='cancel'){
      ctx.error='Payment was cancelled — your time wasn\'t reserved. Pick a time to try again.';
    }
    render();
  }

  boot();
})();
</script>
</body>
</html>
