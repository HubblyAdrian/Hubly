# Minimal Hubly Supabase config — per-function Edge Function flags.
# Google redirects here without a user JWT; CSRF state is validated in-function.

[functions.google-calendar-oauth-callback]
verify_jwt = false

# Adobe IMS redirects here without a Hubly JWT; CSRF state is validated in-function
[functions.adobe-oauth-callback]
verify_jwt = false

# Google Calendar push notifications have no Hubly JWT
[functions.google-calendar-webhook]
verify_jwt = false

# Cron / maintain uses HUBLY_CRON_SECRET or service-role bearer (checked in-function)
[functions.google-calendar-maintain]
verify_jwt = false

# Recurring Schedule → next occurrence — same cron/maintain pattern as
# google-calendar-maintain above, same auth (HUBLY_CRON_SECRET or
# service-role bearer, checked in-function)
[functions.hubly-recurring-maintain]
verify_jwt = false

# Stripe webhooks have no Hubly JWT — verified via Stripe-Signature in-function
[functions.stripe-webhook]
verify_jwt = false

# Public booking checkout (optional session); ownership checked via business + Connect account
[functions.create-booking-checkout]
verify_jwt = false

# Commerce Store checkout — Stripe Connect destination; credentials checked in-function
[functions.create-store-checkout]
verify_jwt = false

# Commerce owner API — JWT checked in-function (owner_id)
[functions.commerce-api]
verify_jwt = false

# Nightly merchandising — HUBLY_CRON_SECRET or service-role bearer checked in-function
[functions.commerce-merchandising]
verify_jwt = false

# Marketplace API — public list/availability/book/request; settings auth checked in-function
[functions.marketplace]
verify_jwt = false

# HublyAI status probe — reports which providers are configured; no secrets returned
[functions.hubly-ai-status]
verify_jwt = false

# Customer Runtime — public AI concierge entry (auth optional for persistence)
[functions.hubly-find-pro]
verify_jwt = false

# Hubly Daily — morning briefing (auth optional when memory/dna provided in body)
[functions.hubly-daily]
verify_jwt = false

# Hubly Brain — Milestone 1 think pipeline + expert registry (auth optional for console/debug)
[functions.hubly-brain]
verify_jwt = false

# Hubly Studio API — JWT checked in-function (owner_id)
[functions.studio-api]
verify_jwt = false

# Customer Portal gateway — identity verified via the magic-link token /
# signed portal session (checked in-function), not a Supabase JWT
[functions.customer-portal]
verify_jwt = false

# Claiming a draft is done by someone with no account yet — the whole point.
# 'start' is anonymous and authorised by a signed assertion from
# /api/draft-session; 'finish' checks the Supabase session itself, in-function.
[functions.claim-draft-business]
verify_jwt = false

# Page generation, moved out of hubly-conversation's EdgeRuntime.waitUntil.
#
# verify_jwt OFF, deliberately, and the in-function check is what replaces it.
#
# It was ON, which was right while the credential was a legacy service_role JWT.
# It is WRONG for the new API keys: an sb_secret_ key is not a JWT, so it cannot
# be sent as `Authorization: Bearer` -- PostgREST and the gateway both reject a
# non-JWT bearer. adminHeaders() therefore sends the credential on `apikey`
# alone, and the gateway then answers "Missing authorization header" BEFORE this
# function's own handler runs. Every build stalled, silently, because the
# dispatch never arrived.
#
# Caught by the end-to-end build check on 2026-08-19, before any key was
# rotated -- which is the entire reason that check exists.
#
# The security property is unchanged and arguably stronger: the handler compares
# the presented credential against the resolved secret key on BOTH the
# Authorization and apikey headers. The gateway only ever checked "is this a
# well-formed JWT", which is a weaker question than "is this OUR key".
[functions.hubly-document-build]
verify_jwt = false
